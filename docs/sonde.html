<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonde</title>
<style>
  html, body { margin: 0; background: #0b1226; color: #e8eefc; font: 16px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { padding: 24px; }
  h1 { font-weight: 300; margin: 0 0 16px; }
  .row { padding: 10px 14px; margin: 0 0 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .ok { color: #7ee0a0; } .ko { color: #ff8a80; } .wait { color: #ffd479; }
  .k { display: inline-block; min-width: 190px; color: #9fb0d6; }
  #bench { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: -1; }
  .cl { position: fixed; top: 0; width: 320px; height: 160px; border-radius: 80px; background: rgba(255,255,255,0.10);
        -webkit-animation: drift 12s linear infinite; animation: drift 12s linear infinite; }
  @-webkit-keyframes drift { from { -webkit-transform: translate3d(-340px,0,0); } to { -webkit-transform: translate3d(1100px,0,0); } }
  @keyframes drift { from { transform: translate3d(-340px,0,0); } to { transform: translate3d(1100px,0,0); } }
</style>
</head>
<body>
<h1>Weather Hub test page</h1>
<div id="out"></div>
<canvas id="bench"></canvas>
<script>
(function () {
  var out = document.getElementById('out');
  function row(key, text, cls) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span class="k">' + key + '</span><span class="' + (cls || '') + '">' + text + '</span>';
    out.appendChild(d);
    return d.lastChild;
  }
  row('Browser', navigator.userAgent);
  row('Screen', screen.width + ' × ' + screen.height + ' · window ' + innerWidth + ' × ' + innerHeight + ' · density ' + (window.devicePixelRatio || 1));
  row('Full screen (home screen)', navigator.standalone ? 'yes' : 'no', navigator.standalone ? 'ok' : 'wait');
  row('Time zone', (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return 'unknown'; } })());

  var tests = [
    ['Forecast', 'https://api.open-meteo.com/v1/forecast?latitude=48.85&longitude=2.35&current=temperature_2m&timezone=auto', function (j) { return 'Paris ' + j.current.temperature_2m + ' °C'; }],
    ['Place search', 'https://geocoding-api.open-meteo.com/v1/search?name=Dublin&count=1&language=en', function (j) { return j.results[0].name + ', ' + j.results[0].country; }],
    ['Air quality', 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=55.75&longitude=37.62&current=european_aqi', function (j) { return 'Moscow, index ' + j.current.european_aqi; }]
  ];
  tests.forEach(function (t) {
    var cell = row(t[0], 'running…', 'wait');
    var t0 = Date.now();
    fetch(t[1]).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      cell.className = 'ok';
      cell.textContent = 'success · ' + t[2](j) + ' · ' + (Date.now() - t0) + ' ms';
    }).catch(function (e) {
      cell.className = 'ko';
      cell.textContent = 'failed · ' + (e && e.message ? e.message : e);
    });
  });

  var fpsCell = row('Animation (250 drops, 10 clouds)', 'measuring in 3 s…', 'wait');
  setTimeout(function () {
    for (var i = 0; i < 10; i++) {
      var c = document.createElement('div');
      c.className = 'cl';
      c.style.top = (40 + i * 60) + 'px';
      c.style.webkitAnimationDelay = c.style.animationDelay = (-i * 1.2) + 's';
      document.body.appendChild(c);
    }
    var cv = document.getElementById('bench');
    cv.width = innerWidth; cv.height = innerHeight;
    var g = cv.getContext('2d');
    var drops = [];
    for (var k = 0; k < 250; k++) drops.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, v: 9 + Math.random() * 6 });
    var frames = 0, start = 0, last = 0;
    function tick(ts) {
      if (!start) start = ts;
      if (ts - last >= 30) {
        last = ts; frames++;
        g.clearRect(0, 0, cv.width, cv.height);
        g.strokeStyle = 'rgba(200,220,255,0.5)'; g.lineWidth = 1.2; g.beginPath();
        for (var n = 0; n < drops.length; n++) {
          var d = drops[n]; d.y += d.v; d.x -= 1.5;
          if (d.y > cv.height) { d.y = -20; d.x = Math.random() * cv.width; }
          g.moveTo(d.x, d.y); g.lineTo(d.x + 2, d.y - 14);
        }
        g.stroke();
      }
      if (ts - start < 20000) { requestAnimationFrame(tick); fpsCell.textContent = 'running… ' + Math.round((ts - start) / 1000) + ' s'; }
      else {
        var fps = Math.round(frames / ((ts - start) / 1000));
        fpsCell.className = fps >= 24 ? 'ok' : (fps >= 18 ? 'wait' : 'ko');
        fpsCell.textContent = fps + ' frames per second (target 30)';
      }
    }
    requestAnimationFrame(tick);
  }, 3000);
})();
</script>
</body>
</html>
