/* Téléphone : la barre d'état prend la couleur du fond de la page dès la première image. Dernière couleur connue
   (haut du ciel, liste, carte), remplacée par app.js (barColor) dès que le ciel est calculé. */
(function () { try { var c = localStorage.getItem('sm.bar'); var m = /OS (\d+)_\d+.* like Mac OS X/.exec(navigator.userAgent); if (c && !(m && +m[1] < 13)) { document.documentElement.style.backgroundColor = c; document.querySelector('meta[name=theme-color]').setAttribute('content', c); } } catch (e) { /* rien */ } })();
</script>
